name: Release Packages (npm, PyPI, NuGet)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------
  # 1. Publish all @meromiti/* packages to npm
  # ------------------------------------------------------------
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @meromiti packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing @meromiti/core..."
          npm publish packages/core --access public

          echo "Publishing @meromiti/web..."
          npm publish packages/web --access public

          echo "Publishing @meromiti/react..."
          npm publish packages/react --access public

          echo "Publishing @meromiti/vue..."
          npm publish packages/vue --access public

          echo "Publishing @meromiti/angular..."
          npm publish packages/angular --access public

          echo "Publishing @meromiti/react-native..."
          npm publish packages/react-native --access public

  # ------------------------------------------------------------
  # 2. Publish mero-miti to PyPI
  # ------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions (wheel & sdist)
        run: |
          cd packages/python
          python -m build
          python -m twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd packages/python
          python -m twine upload dist/* --non-interactive

  # ------------------------------------------------------------
  # 3. Publish MeroMiti to NuGet (Keyless Trusted Publishing OIDC)
  # ------------------------------------------------------------
  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet package
        run: |
          dotnet pack packages/dotnet/MeroMiti.csproj -c Release -o packages/dotnet/bin

      - name: Authenticate with NuGet Trusted Publishing (OIDC)
        uses: NuGet/login@v1

      - name: Push to NuGet.org
        run: |
          dotnet nuget push packages/dotnet/bin/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
